<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер платформы «ЭМО»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Тренажер -->
    <main id="trainer-screen" class="trainer-container">
        <!-- Шаги слева -->
        <div class="steps-sidebar" id="steps-indicator"></div>

        <!-- Центральная карточка -->
        <div class="question-card">
            <div class="image-box">
                <img id="question-img" src="" alt="Задание" ondragstart="return false;">
            </div>

            <div class="instruction-text">Напечатай: <span id="target-word"></span></div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="" autocomplete="off">
               <button id="submit-btn" class="submit-btn" title="Отправить">
    <svg width="36" height="36" viewBox="0 0 28 28" fill="none" style="overflow: visible;">
        <!-- Черная подложка (цельная линия без разрывов и смещений) -->
        <polyline points="4,13 11,21 24,7" stroke="#000000" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="3"></polyline>
        <!-- Серая серединка -->
        <polyline points="4,13 11,21 24,7" stroke="#cccccc" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="3"></polyline>
    </svg>
</button>
            </div>
        </div>

        <!-- Кнопка сброса (красный крестик с черным контуром в правом нижнем углу) -->
        <button id="reset-btn" class="reset-btn" title="Сбросить">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <line x1="18" y1="6" x2="6" y2="18" stroke="#000000" stroke-width="5.5" stroke-linecap="square"></line>
                <line x1="6" y1="6" x2="18" y2="18" stroke="#000000" stroke-width="5.5" stroke-linecap="square"></line>
                <line x1="18" y1="6" x2="6" y2="18" stroke="#e53935" stroke-width="4" stroke-linecap="square"></line>
                <line x1="6" y1="6" x2="18" y2="18" stroke="#e53935" stroke-width="4" stroke-linecap="square"></line>
            </svg>
        </button>
    </main>

    <!-- ЭКРАН 2: Таблица результатов -->
    <main id="results-screen" class="trainer-container results-container" style="display: none;">
        <button id="reset-results-btn" class="reset-btn" title="Перезапустить">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                <line x1="18" y1="6" x2="6" y2="18" stroke="#000000" stroke-width="6.5" stroke-linecap="square"></line>
                <line x1="6" y1="6" x2="18" y2="18" stroke="#000000" stroke-width="6.5" stroke-linecap="square"></line>
                <line x1="18" y1="6" x2="6" y2="18" stroke="#e53935" stroke-width="4" stroke-linecap="square"></line>
                <line x1="6" y1="6" x2="18" y2="18" stroke="#e53935" stroke-width="4" stroke-linecap="square"></line>
            </svg>
        </button>

        <div class="results-card">
            <div class="table-scroll">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Картинка</th>
                            <th>Правильный ответ</th>
                            <th>Твой ответ</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажер платформы «ЭМО»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Тренажер -->
    <main id="trainer-screen" class="trainer-container">
        <!-- Шаги слева -->
        <div class="steps-sidebar" id="steps-indicator"></div>

        <!-- Центральная карточка -->
        <div class="question-card">
            <div class="image-box">
                <img id="question-img" src="" alt="Задание" ondragstart="return false;">
            </div>

            <div class="instruction-text">Напечатай: <span id="target-word"></span></div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="" autocomplete="off">
                <!-- Кнопка отправки заполняется динамически из script.js -->
                <button id="submit-btn" class="submit-btn" title="Отправить"></button>
            </div>
        </div>

        <!-- Кнопка сброса (заполняется динамически из script.js) -->
        <button id="reset-btn" class="reset-btn" title="Сбросить"></button>
    </main>

    <!-- ЭКРАН 2: Таблица результатов -->
    <main id="results-screen" class="trainer-container results-container" style="display: none;">
        <!-- Кнопка перезапуска (заполняется динамически из script.js) -->
        <button id="reset-results-btn" class="reset-btn" title="Перезапустить"></button>

        <div class="results-card">
            <div class="table-scroll">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Картинка</th>
                            <th>Правильный ответ</th>
                            <th>Твой ответ</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody id="results-tbody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
